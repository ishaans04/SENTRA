[build-system]
requires = ["hatchling>=1.26.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "hive-core"
version = "0.0.0"
description = "HIVE security-analysis core: expected-vs-observed graph projection, capability-composition detection, and constrained containment planning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
keywords = [
  "ai-security",
  "agent-security",
  "multi-agent-systems",
  "llm-security",
  "threat-detection",
  "graph-analysis",
  "prompt-injection",
  "defensive-security",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "networkx>=3.3,<4.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/ishaans04/SENTRA"
"Live console" = "https://ishaans04.github.io/SENTRA/console/"
Overview = "https://ishaans04.github.io/SENTRA/"
Source = "https://github.com/ishaans04/SENTRA"
Issues = "https://github.com/ishaans04/SENTRA/issues"

[project.optional-dependencies]
telemetry = [
  "opentelemetry-api>=1.28.0,<2.0.0",
  "opentelemetry-sdk>=1.28.0,<2.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "hypothesis>=6.112.0,<7.0.0",
  "mypy>=1.13.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.8.0,<1.0.0",
  "types-PyYAML>=6.0.0,<7.0.0",
  "types-networkx>=3.3,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hive_core"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "ARG"]
ignore = ["B008"]  # FastAPI dependencies are declared as call defaults by design.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG002"]  # pytest fixtures are injected, not always referenced.

[tool.ruff.lint.isort]
known-first-party = ["hive_core", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true

# Tests assert on behaviour, not on types. Strict annotation rules there add
# noise without adding safety, so the product code carries the strict contract
# and the tests are checked for genuine type errors only.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.coverage.run]
branch = true
source = ["hive_core"]
