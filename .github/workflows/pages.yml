name: Deploy site

# Publishes the site to GitHub Pages: the overview at the root, the console
# at /console/. The console ships with a recording of the engine's output at
# every replay position, so the hosted page is fully interactive with no
# backend — and it says on screen that it is a recording.
#
# To turn this on: Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the console and assembles it under the overview page. The same
      # command produces the same tree locally.
      - run: pnpm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
