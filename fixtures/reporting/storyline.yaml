# The storyline (PRD §7.3), as data. Each beat is a list of steps the scenario
# runner performs in order. A step either makes an agent call through the
# gateway, or acts as a person at the console.
#
# Run ids are fixed so the console, the tests and the recorded replay agree:
# S-1 is the support run under D-0, R-1 the original reporting run under D-1.

beats:
  - n: 0
    title: Seed
    steps: []

  - n: 1
    title: Approve
    steps:
      - op: approve
        text: >-
          Approve reporting, on the condition that the Reporting Agent only reads from
          the approved, sanitized report store.

  - n: 2
    title: Support works
    steps:
      - { op: start_run, run: S-1, actor: support-agent, decision: D-0 }
      - { op: call, run: S-1, tool: crm.read_customer_records, args: { customer_id: cust-1042 } }
      - op: call
        run: S-1
        tool: report_store.write_summary
        args: { item: summary-1, content: "Ticket 1042 resolved: billing address corrected. No personal data included." }

  - n: 3
    title: Reporting works
    steps:
      - { op: start_run, run: R-1, actor: reporting-agent, decision: D-1 }
      - { op: call, run: R-1, tool: report_store.read_summaries, args: {} }
      - op: call
        run: R-1
        tool: report_store.write_draft
        args: { item: draft-1, content: "Weekly support report: 1 ticket resolved (billing)." }
      - { op: call, run: R-1, tool: webhook.send_report, args: { item: draft-1 } }

  - n: 4
    title: Human edit
    steps:
      - op: human_edit
        item: draft-1
        content: "Weekly support report: 1 billing ticket resolved within SLA. Reviewed by the support lead."

  - n: 5
    title: Unexpected connection
    steps:
      - op: call
        run: S-1
        tool: scratchpad.write
        args: { item: note-1, content: "Customer 1042 contact details for follow-up." }
      - { op: call, run: S-1, tool: scratchpad.grant_access, args: { grantee: reporting-agent } }
      - { op: call, run: R-1, tool: scratchpad.read, args: {} }

  # Beats 6 and 7 happen inside beat 5: the scratchpad read completes the route,
  # the engine raises the finding and D-1 is suspended within that same call.

  - n: 8
    title: Late action
    steps:
      - { op: call, run: R-1, tool: webhook.send_report, args: { item: draft-1 } }

  - n: 9
    title: Dictated recovery
    steps:
      - op: recover
        text: >-
          Stop this reporting run, remove its scratchpad access, and rebuild the report
          from approved summaries. Keep the support work.

  # Beat 11, the execution, happens inside the confirmation.
  - n: 10
    title: Confirm
    steps:
      - { op: confirm_recovery }

  - n: 12
    title: Replacement
    steps:
      - { op: call, run: R-2, tool: report_store.read_summaries, args: {} }
      - op: call
        run: R-2
        tool: report_store.write_draft
        args: { item: draft-2, content: "Weekly support report: 1 billing ticket resolved. Built from approved summaries only." }
      - { op: call, run: R-2, tool: webhook.send_report, args: { item: draft-2 } }
      - { op: release }
      - { op: complete_run, run: R-2 }

  - n: 13
    title: Verify
    steps:
      - { op: verify }

  - n: 14
    title: Record
    steps:
      - { op: close_record }
