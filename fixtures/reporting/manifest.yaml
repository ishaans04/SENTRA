# Declared architecture: the reporting estate behind the SENTRA gateway.
#
# Two agents, four fictional tool servers. Support reads customer records and
# writes sanitized summaries; Reporting reads those summaries, writes drafts and
# sends approved reports out. The shared scratchpad exists, but no declared
# workflow uses it, which is what makes a route through it a finding.
#
# Every actor, record and destination is fictional. The webhook is a counter;
# nothing leaves the process.

version: "reporting-estate/v1"

zones:
  restricted:
    order: 1
    label: Restricted
    trust: internal
    description: Customer records. Read by Support only.
  support:
    order: 2
    label: Support
    trust: internal
    description: Resolves tickets using customer context.
  reporting:
    order: 3
    label: Reporting
    trust: internal
    description: Prepares and sends approved external reports.
  approved-state:
    order: 4
    label: Report store
    trust: internal
    description: Sanitized summaries and internal report drafts.
  shared-state:
    order: 5
    label: Shared state
    trust: untrusted
    description: Ad-hoc storage that no declared workflow relies on.
  external:
    order: 6
    label: External
    trust: external
    description: Anything outside the estate boundary.

nodes:
  - id: support-agent
    kind: agent
    label: Support Agent
    zone: support
    data_classification: internal
    registration: expected
  - id: reporting-agent
    kind: agent
    label: Reporting Agent
    zone: reporting
    data_classification: internal
    registration: expected
  - id: crm
    kind: datasource
    label: Customer records (CRM)
    zone: restricted
    data_classification: restricted
    registration: expected
  - id: report_store/approved_summaries
    kind: store
    label: Approved summaries
    zone: approved-state
    data_classification: internal
    registration: expected
  - id: report_store/drafts
    kind: store
    label: Report drafts
    zone: approved-state
    data_classification: internal
    registration: expected
  - id: scratchpad
    kind: store
    label: Shared scratchpad
    zone: shared-state
    data_classification: internal
    registration: unregistered
  - id: webhook
    kind: destination
    label: External report webhook
    zone: external
    data_classification: public
    registration: expected

allowed_relationships:
  - { source: support-agent,   action: read,  target: crm }
  - { source: support-agent,   action: write, target: report_store/approved_summaries }
  - { source: reporting-agent, action: read,  target: report_store/approved_summaries }
  - { source: reporting-agent, action: write, target: report_store/drafts }
  - { source: reporting-agent, action: read,  target: report_store/drafts }
  - { source: reporting-agent, action: send,  target: webhook }

invariants:
  - id: no-restricted-egress-via-unregistered-state
    description: >-
      Customer records must not become reachable from the external webhook
      through storage the architecture does not declare.
    source_data_class: restricted
    sink_zone: external
    required_bridge_registration: unregistered
    status: prohibited

# The four options the engine compares for the storyline (PRD §11.7). Costs are set so
# the cheapest option that keeps declared work intact is the recommendation.
control_capabilities:
  - id: deny-reporting-scratchpad-read
    type: block_edge
    label: Deny the Reporting Agent reads from the scratchpad
    source: reporting-agent
    action: read
    target: scratchpad
    reversible: true
    cost: 1
    rationale: >-
      Cuts the withdrawal hop. No declared workflow reads the scratchpad.
  - id: quarantine-scratchpad
    type: quarantine_node
    label: Quarantine the scratchpad for every actor
    target: scratchpad
    reversible: true
    cost: 4
    rationale: >-
      Certain to close the route, but heavier than cutting one relationship.
  - id: block-reporting-webhook-send
    type: block_edge
    label: Block the Reporting Agent sends to the webhook
    source: reporting-agent
    action: send
    target: webhook
    reversible: true
    cost: 6
    rationale: >-
      Closes the route by stopping declared external reporting.
  - id: deny-support-crm-read
    type: block_edge
    label: Deny the Support Agent reads from the CRM
    source: support-agent
    action: read
    target: crm
    reversible: true
    cost: 9
    rationale: >-
      Closes the route by stopping declared support work.
