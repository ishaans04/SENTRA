<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>HAEGIS — voice-guided containment and recovery for human–AI teams</title>
    <meta
      name="description"
      content="HIVE detects risky capability compositions that emerge between individually legitimate AI agents, and contains them with the smallest pre-authorised action that preserves declared work."
    />
    <meta name="theme-color" content="#07080A" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://ishaans04.github.io/SENTRA/console/" />

    <!-- Link previews. Absolute URLs: unfurlers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HIVE" />
    <meta property="og:title" content="HIVE — security for what happens between agents" />
    <meta
      property="og:description"
      content="Every action permitted. The population still composes a route from restricted data to the outside world. HIVE finds it, contains it with the smallest pre-authorised action, and proves the declared workflow survived."
    />
    <meta property="og:url" content="https://ishaans04.github.io/SENTRA/console/" />
    <meta
      property="og:image"
      content="https://ishaans04.github.io/SENTRA/social-preview.png"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="A composed path descending through four trust zones from restricted customer records to an external destination."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HIVE — security for what happens between agents" />
    <meta
      name="twitter:description"
      content="Population-level security for autonomous agent estates. Deterministic, local-first, no LLM at runtime."
    />
    <meta
      name="twitter:image"
      content="https://ishaans04.github.io/SENTRA/social-preview.png"
    />

    <!--
      Typefaces load from Google Fonts as progressive enhancement. The stack in
      index.css falls back to system faces, so the console renders correctly
      with no network at all — which matters, because HIVE's analysis itself
      never needs one.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
